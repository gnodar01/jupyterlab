[workspace]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]
preview = ["pixi-build"]

[package]
name = "jldracula"
version = "0.2.0"

[package.build]
backend = { name = "pixi-build-python", version = "0.1.*" }

[tasks]

[dependencies]
python = "3.9.*"

[pypi-dependencies]
jldracula = { path = ".", editable = true }

[package.host-dependencies]
jupyter_packaging = ">=0.12.0"
jupyterlab = ">=3.0.0,<5"
setuptools = ">=40.8.0"
wheel = ">=0.45.1,<0.46"
